[project]
name = "tinyledger"
version = "0.1.0"
description = "A small double-entry bookkeeping library (the Quod demo project)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
